name: Assemble verified desktop preview30
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: verified-desktop-preview30
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: que-yaodong/dong-tools-releases
    steps:
      - name: Assemble and verify the already tested installer
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, tempfile
          from concurrent.futures import ThreadPoolExecutor
          repo = 'que-yaodong/dong-tools-releases'
          tag = 'desktop-v1.1.0-preview.30'
          filename = 'DongTools-Setup-1.1.0-preview.30-win-x64.exe'
          expected = 'c6d6ee45df4ffcd1c4ba7c932f6de0fd9d394f288bb2432db798d4f7d815d527'
          size = 520448000
          def api(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
          release = next(r for r in api(f'/repos/{repo}/releases?per_page=100') if r['tag_name'] == tag)
          assert release['draft'], 'Only the unpublished preview30 draft may be assembled'
          names = [f'preview30.installer.part.{i:03}' for i in range(63)]
          assets = {a['name']: a for a in api(f'/repos/{repo}/releases/{release["id"]}/assets?per_page=100')}
          assert all(name in assets for name in names), 'Incomplete staged installer'
          with tempfile.TemporaryDirectory() as directory:
              directory = pathlib.Path(directory)
              def fetch_part(name):
                  with (directory / name).open('wb') as target:
                      subprocess.run(['gh', 'api', '-H', 'Accept: application/octet-stream', f'/repos/{repo}/releases/assets/{assets[name]["id"]}'], stdout=target, check=True)
              with ThreadPoolExecutor(max_workers=6) as pool:
                  list(pool.map(fetch_part, names))
              output = directory / filename
              digest = hashlib.sha256()
              with output.open('wb') as target:
                  for name in names:
                      part = directory / name
                      assert part.stat().st_size == assets[name]['size']
                      assert 'sha256:' + hashlib.sha256(part.read_bytes()).hexdigest() == assets[name]['digest']
                      with part.open('rb') as source:
                          while block := source.read(1024 * 1024):
                              target.write(block)
                              digest.update(block)
              assert output.stat().st_size == size and digest.hexdigest() == expected, 'Installer differs from the locally tested package'
              if filename not in assets:
                  subprocess.run(['gh', 'release', 'upload', tag, str(output), '--repo', repo], check=True)
              updated = api(f'/repos/{repo}/releases/{release["id"]}')
              installer = next(a for a in api(f'/repos/{repo}/releases/{release["id"]}/assets?per_page=100') if a['name'] == filename)
              assert updated['draft'] and installer['size'] == size and installer['digest'] == 'sha256:' + expected
              for name in names:
                  subprocess.run(['gh', 'api', '--method', 'DELETE', f'/repos/{repo}/releases/assets/{assets[name]["id"]}'], check=True)
              print('Verified original installer assembled; draft retained for final publication.')
          PY
